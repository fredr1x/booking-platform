spring:
  application:
    name: catalog-service
  profiles:
    default: local
  threads:
    virtual:
      enabled: true
  # Адрес и пароль БД только в профиле local, в остальных окружениях SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD.
  datasource:
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 2000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        # ленивые коллекции (артисты событий) грузятся пачкой WHERE event_id IN (...), а не по запросу на событие
        default_batch_fetch_size: 50
  flyway:
    locations: classpath:db/migration
  cache:
    redis:
      # hit/miss в метриках cache.gets: /actuator/metrics/cache.gets?tag=result:hit
      enable-statistics: true

server:
  port: 8082
  shutdown: graceful
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:postgresql://localhost:5433/catalog
    username: booking
    password: booking
  flyway:
    locations: classpath:db/migration,classpath:db/seed
  data:
    redis:
      host: localhost
      port: 6379
  elasticsearch:
    uris: http://localhost:9200
