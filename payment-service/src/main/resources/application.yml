spring:
  application:
    name: payment-service
  profiles:
    default: local
  threads:
    virtual:
      enabled: true
  # Адрес и пароль БД только в профиле local, в docker их задают SPRING_DATASOURCE_* и SPRING_KAFKA_BOOTSTRAP_SERVERS
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  kafka:
    producer:
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 5000
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000
    consumer:
      auto-offset-reset: earliest
    listener:
      # по consumer'у на партицию: медленный платёж держит только свою партицию
      concurrency: 3

payment:
  delay: 500ms
  failure-rate: 0.1
  kafka:
    retry-delay: 1s

server:
  port: 8083
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:postgresql://localhost:5433/payment
    username: booking
    password: booking
  kafka:
    bootstrap-servers: localhost:9092
