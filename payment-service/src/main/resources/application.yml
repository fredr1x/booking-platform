spring:
  application:
    name: payment-service
  profiles:
    default: local
  threads:
    virtual:
      enabled: true
  # Адрес и пароль БД только в профиле local, в docker их задают SPRING_DATASOURCE_*
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

payment:
  delay: 500ms
  failure-rate: 0.1
  # chaos: PAYMENT_ERROR_RATE=0.5 PAYMENT_DELAY=3s, см. docs/adr/0008-resilience-and-saga.md
  error-rate: 0

server:
  port: 8083
  shutdown: graceful

management:
  metrics:
    distribution:
      # бакеты гистограммы: p95/p99 считает Prometheus (histogram_quantile) сразу по всем инстансам
      percentiles-histogram:
        http.server.requests: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:postgresql://localhost:5433/payment
    username: booking
    password: booking
