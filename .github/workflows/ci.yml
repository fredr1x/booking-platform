name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# новый пуш в ту же ветку отменяет старую сборку
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # unit- и интеграционные тесты; Testcontainers поднимает Postgres, Kafka, Redis, MongoDB и Elasticsearch в Docker раннера
      - name: Build and test
        run: ./mvnw -B verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: "**/target/surefire-reports/"

      # образы только собираются: реестра пока нет
      - name: Build Docker images
        run: docker compose --profile apps build
