# Профиль интеграционных тестов. Адрес БД подставляет Testcontainers (@ServiceConnection).
spring:
  flyway:
    locations: classpath:db/migration,classpath:db/seed
  datasource:
    hikari:
      # тест на гонку ставит в очередь к пулу из 20 соединений тысячу потоков, 2 секунды ожидания им мало
      connection-timeout: 60000
  jpa:
    properties:
      hibernate:
        # счётчик выполненных SQL: по нему тест ловит N+1
        generate_statistics: true

booking:
  # релей outbox тесты вызывают сами, чтобы видеть сообщения до и после отправки
  scheduling:
    enabled: false
  kafka:
    retry-delay: 100ms
