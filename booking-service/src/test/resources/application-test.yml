# Профиль интеграционных тестов. Адрес БД подставляет Testcontainers (@ServiceConnection).
spring:
  flyway:
    locations: classpath:db/migration,classpath:db/seed
  datasource:
    hikari:
      # тест на гонку ставит в очередь к пулу из 20 соединений тысячу потоков, 2 секунды ожидания им мало
      connection-timeout: 60000
  jpa:
    properties:
      hibernate:
        # счётчик выполненных SQL: по нему тест ловит N+1
        generate_statistics: true

# Тысяча проверок события в тесте гонки склеивается в один запрос к заглушке каталога. На медленном
# раннере CI он не укладывался в 2 секунды, и все 1000 броней падали с CatalogUnavailableException.
catalog:
  timeout: 30s

booking:
  admission:
    # событие только для теста пропусков: остальные тесты бронируют без токена
    flash-sale-events: 998
    token-secret: test-admission-token-secret-0000001
  # релей outbox тесты вызывают сами, чтобы видеть сообщения до и после отправки
  scheduling:
    enabled: false
  kafka:
    retry-delay: 100ms
