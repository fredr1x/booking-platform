spring:
  application:
    name: booking-service
  profiles:
    default: local
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/booking}
    username: ${DB_USER:booking}
    password: ${DB_PASSWORD:booking}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 2000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_updates: true
  flyway:
    locations: classpath:db/migration

booking:
  hold-ttl: 10m
  seat-locking: atomic
  expiration-sweep-interval: 30s
  pricing:
    early-bird-window: 72h
    early-bird-discount: 0.15
    demand-threshold: 0.80
    demand-max-markup: 0.50

server:
  port: 8081
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

---
spring:
  config:
    activate:
      on-profile: local
  flyway:
    locations: classpath:db/migration,classpath:db/seed
