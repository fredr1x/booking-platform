spring:
  application:
    name: booking-service
  profiles:
    default: local
  threads:
    virtual:
      enabled: true
  # Адрес и пароль БД только в профиле local. В docker и на сервере их задают переменные окружения
  # SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD: без них сервис не стартует, а не уходит молча в чужую базу.
  datasource:
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 2000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_updates: true
        # места брони в ответе грузятся одним IN-запросом, а не по запросу на место (N+1)
        default_batch_fetch_size: 50
  flyway:
    locations: classpath:db/migration

# Вне профиля local адрес каталога задаёт переменная CATALOG_URL
catalog:
  timeout: 2s
  # одинаковые проверки события на старте продаж склеиваются, ответ каталога живёт в памяти столько
  cache-ttl: 5s

booking:
  hold-ttl: 10m
  seat-locking: atomic
  expiration-sweep-interval: 30s
  pricing:
    early-bird-window: 72h
    early-bird-discount: 0.15
    demand-threshold: 0.80
    demand-max-markup: 0.50

server:
  port: 8081
  shutdown: graceful
  # Location и ссылки строим по X-Forwarded-* от gateway, иначе клиент увидит внутренний адрес :8081.
  # Доверять им можно, пока снаружи сервис доступен только через gateway.
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:postgresql://localhost:5433/booking
    username: booking
    password: booking
  flyway:
    locations: classpath:db/migration,classpath:db/seed

catalog:
  url: http://localhost:8082
