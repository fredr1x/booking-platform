spring:
  application:
    name: booking-service
  profiles:
    default: local
  threads:
    virtual:
      enabled: true
  # Адрес и пароль БД только в профиле local. В docker и на сервере их задают переменные окружения
  # SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD: без них сервис не стартует, а не уходит молча в чужую базу.
  datasource:
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 2000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_updates: true
        # места брони в ответе грузятся одним IN-запросом, а не по запросу на место (N+1)
        default_batch_fetch_size: 50
  flyway:
    locations: classpath:db/migration
  # Адрес брокера вне профиля local задаёт SPRING_KAFKA_BOOTSTRAP_SERVERS
  kafka:
    producer:
      # запись подтверждают все синхронные реплики; идемпотентный producer не пишет дубли при своих ретраях
      acks: all
      properties:
        enable.idempotence: true
        # без брокера send() ждёт метаданные до max.block.ms (60 с по умолчанию), а релей держит транзакцию
        max.block.ms: 5000
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000
    consumer:
      # новая группа читает топик с начала, а не только новые сообщения
      auto-offset-reset: earliest

# Вне профиля local адрес каталога задаёт переменная CATALOG_URL
catalog:
  timeout: 2s
  # одинаковые проверки события на старте продаж склеиваются, ответ каталога живёт в памяти столько
  cache-ttl: 5s

booking:
  hold-ttl: 10m
  seat-locking: redis
  # сверх этого числа одновременных POST /bookings сразу 503 + Retry-After; в 5 раз больше пула соединений с БД
  max-concurrent-requests: 100
  # события, которые можно бронировать только с пропуском из очереди; секрет вне local задаёт ADMISSION_TOKEN_SECRET
  admission:
    flash-sale-events: ${FLASH_SALE_EVENTS:}
    token-secret: ${ADMISSION_TOKEN_SECRET}
  # брони истекают по очереди в Redis раз в секунду; обход таблицы только запасной, на случай потери данных в Redis
  hold-expiration-poll-interval: 1s
  expiration-sweep-interval: 5m
  outbox:
    relay-interval: 200ms
  kafka:
    # первая пауза перед повтором сообщения, дальше ×2
    retry-delay: 1s
  pricing:
    early-bird-window: 72h
    early-bird-discount: 0.15
    demand-threshold: 0.80
    demand-max-markup: 0.50

server:
  port: 8081
  shutdown: graceful
  # Location и ссылки строим по X-Forwarded-* от gateway, иначе клиент увидит внутренний адрес :8081.
  # Доверять им можно, пока снаружи сервис доступен только через gateway.
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:postgresql://localhost:5433/booking
    username: booking
    password: booking
  flyway:
    locations: classpath:db/migration,classpath:db/seed
  kafka:
    bootstrap-servers: localhost:9092
  data:
    redis:
      host: localhost
      port: 6379

catalog:
  url: http://localhost:8082

booking:
  admission:
    token-secret: local-dev-admission-token-secret-0001
