# Локальная инфраструктура. Лимиты памяти рассчитаны на ноутбук с 16 ГБ (см. PLAN.md).
name: booking

services:
  postgres:
    image: postgres:17-alpine
    container_name: booking-postgres
    environment:
      POSTGRES_DB: booking
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - max_connections=200
      - -c
      - work_mem=4MB
    ports:
      - "5433:5432"   # 5432 на хосте часто занят локальным Postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # скрипты выполняются только при создании тома: здесь создаётся база catalog
      - ./deploy/compose/postgres:/docker-entrypoint-initdb.d:ro
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking -d booking"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
