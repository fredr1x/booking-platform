# Локальная инфраструктура. Лимиты памяти рассчитаны на ноутбук с 16 ГБ (см. PLAN.md).
name: booking

# Общие настройки сервисов из профиля apps
x-app: &app
  profiles: ["apps"]
  mem_limit: 512m
  # -XX:+ExitOnOutOfMemoryError в образе роняет процесс, Docker поднимает его заново
  restart: on-failure

x-app-healthcheck: &app-healthcheck
  interval: 10s
  timeout: 5s
  # каталог на первом старте накатывает 100 000 событий
  start_period: 120s
  retries: 6

x-app-env: &app-env
  SPRING_PROFILES_ACTIVE: docker
  SPRING_DATASOURCE_USERNAME: booking
  SPRING_DATASOURCE_PASSWORD: booking
  ADMISSION_TOKEN_SECRET: ${ADMISSION_TOKEN_SECRET:-local-dev-admission-token-secret-0001}

services:
  postgres:
    image: postgres:17-alpine
    container_name: booking-postgres
    environment:
      POSTGRES_DB: booking
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - max_connections=200
      - -c
      - work_mem=4MB
    ports:
      - "5433:5432"   # 5432 на хосте часто занят локальным Postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # скрипты выполняются только при создании тома: здесь создаются базы catalog и payment
      - ./deploy/compose/postgres:/docker-entrypoint-initdb.d:ro
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking -d booking"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Один брокер в режиме KRaft: контроллер встроен, ZooKeeper не нужен.
  # Два listener'а: localhost:9092 для сервисов из IDE, kafka:19092 для контейнеров в той же сети.
  kafka:
    image: apache/kafka:4.1.1
    container_name: booking-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,DOCKER://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,DOCKER://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,DOCKER:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      # служебные топики с одной репликой: брокер один
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    ports:
      - "9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10

  # Claim мест, очередь истечения холдов, кэш каталога и заполненности.
  # volatile-lru: при нехватке памяти вытесняются только ключи с TTL (claim'ы и кэш),
  # а очередь hold-expirations без TTL остаётся.
  redis:
    image: redis:7.4-alpine
    container_name: booking-redis
    command: ["redis-server", "--maxmemory", "192mb", "--maxmemory-policy", "volatile-lru"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # notification-service: отправленные уведомления и история броней пользователя (read-модель)
  mongo:
    image: mongo:8.0
    container_name: booking-mongo
    command: ["--wiredTigerCacheSizeGB", "0.25"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Поиск событий каталога. Один узел без TLS и пароля: только для локальной разработки.
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.2.4
    container_name: booking-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health?wait_for_status=yellow > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20

  # Просмотр топиков и сообщений: docker compose --profile tools up -d kafka-ui, затем http://localhost:8090
  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.3.0
    container_name: booking-kafka-ui
    profiles: ["tools"]
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
    ports:
      - "8090:8080"
    depends_on:
      kafka:
        condition: service_healthy
    mem_limit: 512m

  # Сервисы в контейнерах: docker compose --profile apps up -d --build --wait
  # Без профиля поднимается только инфраструктура, а сервисы запускаются из IDE.
  # Профиль docker не совпадает с local: адреса берутся из переменных ниже, а не из localhost.
  api-gateway:
    <<: *app
    build:
      context: .
      args:
        MODULE: api-gateway
    image: booking/api-gateway
    container_name: booking-api-gateway
    environment:
      SPRING_PROFILES_ACTIVE: docker
      BOOKING_SERVICE_URL: http://booking-service:8081
      CATALOG_SERVICE_URL: http://catalog-service:8082
      NOTIFICATION_SERVICE_URL: http://notification-service:8084
      WAITING_ROOM_SERVICE_URL: http://waiting-room-service:8085
    ports:
      - "8080:8080"
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
    depends_on:
      booking-service:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      waiting-room-service:
        condition: service_healthy

  booking-service:
    <<: *app
    build:
      context: .
      args:
        MODULE: booking-service
    image: booking/booking-service
    container_name: booking-booking-service
    environment:
      <<: *app-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/booking
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration,classpath:db/seed
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      SPRING_DATA_REDIS_HOST: redis
      CATALOG_URL: http://catalog-service:8082
      FLASH_SALE_EVENTS: ${FLASH_SALE_EVENTS:-}
    ports:
      - "8081:8081"
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health/readiness"]
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy

  catalog-service:
    <<: *app
    build:
      context: .
      args:
        MODULE: catalog-service
    image: booking/catalog-service
    container_name: booking-catalog-service
    environment:
      <<: *app-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/catalog
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration,classpath:db/seed
      SPRING_DATA_REDIS_HOST: redis
      SPRING_ELASTICSEARCH_URIS: http://elasticsearch:9200
    ports:
      - "8082:8082"
    healthcheck:
      <<: *app-healthcheck
      # readiness, а не весь health: без Elasticsearch каталог работает, отказывает только поиск
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/actuator/health/readiness"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

  payment-service:
    <<: *app
    build:
      context: .
      args:
        MODULE: payment-service
    image: booking/payment-service
    container_name: booking-payment-service
    environment:
      <<: *app-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/payment
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    ports:
      - "8083:8083"
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD", "wget", "-qO-", "http://localhost:8083/actuator/health/readiness"]
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  notification-service:
    <<: *app
    build:
      context: .
      args:
        MODULE: notification-service
    image: booking/notification-service
    container_name: booking-notification-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_MONGODB_URI: mongodb://mongo:27017/notification
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    ports:
      - "8084:8084"
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD", "wget", "-qO-", "http://localhost:8084/actuator/health/readiness"]
    depends_on:
      mongo:
        condition: service_healthy
      kafka:
        condition: service_healthy

  waiting-room-service:
    <<: *app
    build:
      context: .
      args:
        MODULE: waiting-room-service
    image: booking/waiting-room-service
    container_name: booking-waiting-room-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATA_REDIS_HOST: redis
      ADMISSION_TOKEN_SECRET: ${ADMISSION_TOKEN_SECRET:-local-dev-admission-token-secret-0001}
      FLASH_SALE_EVENTS: ${FLASH_SALE_EVENTS:-2}
    ports:
      - "8085:8085"
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD", "wget", "-qO-", "http://localhost:8085/actuator/health/readiness"]
    depends_on:
      redis:
        condition: service_healthy

volumes:
  postgres-data:
  kafka-data:
  mongo-data:
  redis-data:
  elasticsearch-data:
