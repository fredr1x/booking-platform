spring:
  application:
    name: notification-service
  profiles:
    default: local
  threads:
    virtual:
      enabled: true
  # Адреса MongoDB и Kafka только в профиле local, в docker их задают SPRING_MONGODB_URI и SPRING_KAFKA_BOOTSTRAP_SERVERS
  data:
    mongodb:
      # индексы из @Indexed создаются на старте
      auto-index-creation: true
  kafka:
    consumer:
      auto-offset-reset: earliest
    listener:
      concurrency: 3

notification:
  kafka:
    retry-delay: 1s

server:
  port: 8084
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

---
spring:
  config:
    activate:
      on-profile: local
  mongodb:
    uri: mongodb://localhost:27017/notification
  kafka:
    bootstrap-servers: localhost:9092
